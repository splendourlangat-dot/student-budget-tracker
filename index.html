
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Budget Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 25px 15px;
    }

    .container {
      max-width: 750px;
      margin: auto;
    }

    h1 {
      color: #123c69;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #64748b;
      margin-top: 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin: 18px 0;
      box-shadow: 0 3px 12px #0000000a;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .summary .card {
      margin: 0;
      padding: 15px 10px;
      overflow-wrap: anywhere;
    }

    .summary p {
      color: #64748b;
      font-size: 13px;
      margin: 0 0 10px;
    }

    .summary h2 {
      font-size: clamp(15px, 3.5vw, 23px);
      margin: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 7px;
      font-size: 15px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: none;
      background: #123c69;
      color: white;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #1d568c;
    }

    .budget-row {
      display: flex;
      gap: 10px;
    }

    .budget-row input {
      flex: 1;
      min-width: 0;
    }

    .budget-row button {
      width: auto;
      margin-top: 0;
    }

    .expense {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .expense small {
      display: block;
      color: #64748b;
      margin-top: 5px;
    }

    .expense-right {
      text-align: right;
      font-weight: bold;
    }

    .delete-btn {
      width: auto;
      padding: 7px 10px;
      margin-top: 7px;
      background: #b91c1c;
      font-size: 12px;
    }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 15px;
    }

    #message {
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 450px) {
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Student Budget Tracker</h1>
    <p class="subtitle">
      Manage your money. Understand your spending.
    </p>

    <section class="card">
      <h3>Set Your Budget (KES)</h3>
      <div class="budget-row">
        <input
          type="number"
          id="budgetInput"
          min="0"
          step="0.01"
          placeholder="e.g. 3000"
        >
        <button onclick="setBudget()">Save Budget</button>
      </div>
    </section>

    <section class="summary">
      <div class="card">
        <p>Total Budget</p>
        <h2 id="budget">KES 0</h2>
      </div>

      <div class="card">
        <p>Total Spent</p>
        <h2 id="spent">KES 0</h2>
      </div>

      <div class="card">
        <p>Balance Left</p>
        <h2 id="balance">KES 0</h2>
      </div>
    </section>

    <section class="card">
      <h3>Record an Expense</h3>

      <form id="expenseForm">
        <label for="description">What did you spend on?</label>
        <input
          id="description"
          type="text"
          placeholder="e.g. Food"
          maxlength="80"
          required
        >

        <label for="amount">Amount (KES)</label>
        <input
          id="amount"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="e.g. 150"
          required
        >

        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Internet</option>
          <option>School Supplies</option>
          <option>Personal Care</option>
          <option>Other</option>
        </select>

        <button type="submit">Add Expense</button>
        <p id="message" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h3>Expense History</h3>
      <div id="expenseList"></div>
    </section>
  </main>

  <script>
    let budget = Number(localStorage.getItem("studentBudget")) || 0;

    let expenses = JSON.parse(
      localStorage.getItem("studentExpenses") || "[]"
    );

    const money = amount =>
      "KES " + amount.toLocaleString("en-KE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    function saveData() {
      localStorage.setItem("studentBudget", budget);
      localStorage.setItem(
        "studentExpenses",
        JSON.stringify(expenses)
      );
    }

    function setBudget() {
      const input = document.getElementById("budgetInput");
      const value = Number(input.value);

      if (input.value.trim() === "" ||
          !Number.isFinite(value) || value < 0) {
        alert("Please enter a valid budget.");
        return;
      }

      budget = value;
      saveData();
      render();
      input.value = "";
    }

    document.getElementById("expenseForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const description =
          document.getElementById("description").value.trim();

        const amountInput =
          document.getElementById("amount");

        const amount = Number(amountInput.value);

        const category =
          document.getElementById("category").value;

        if (!description ||
            amountInput.value.trim() === "" ||
            !Number.isFinite(amount) ||
            amount <= 0) {
          showMessage("Enter a description and a valid amount.");
          return;
        }

        expenses.push({
          id: Date.now() + Math.random(),
          description,
          amount,
          category,
          date: new Date().toLocaleDateString()
        });

        saveData();
        render();
        this.reset();

        showMessage("Expense recorded successfully!");
      });

    function deleteExpense(id) {
      expenses = expenses.filter(item => item.id !== id);
      saveData();
      render();
    }

    function showMessage(message) {
      document.getElementById("message").textContent = message;
    }

    function render() {
      const totalSpent = expenses.reduce(
        (total, item) => total + item.amount, 0
      );

      document.getElementById("budget").textContent =
        money(budget);

      document.getElementById("spent").textContent =
        money(totalSpent);

      document.getElementById("balance").textContent =
        money(budget - totalSpent);

      const list = document.getElementById("expenseList");

      if (expenses.length === 0) {
        list.innerHTML =
          '<p class="empty">No expenses recorded yet.</p>';
        return;
      }

      list.replaceChildren();

      [...expenses].reverse().forEach(item => {
        const row = document.createElement("div");
        row.className = "expense";

        const details = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = item.description;

        const meta = document.createElement("small");
        meta.textContent =
          `${item.category} • ${item.date}`;

        details.append(title, meta);

        const right = document.createElement("div");
        right.className = "expense-right";

        const price = document.createElement("div");
        price.textContent = money(item.amount);

        const remove = document.createElement("button");
        remove.className = "delete-btn";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label",
          `Delete ${item.description}`);

        remove.addEventListener("click", () => {
          deleteExpense(item.id);
        });

        right.append(price, remove);
        row.append(details, right);
        list.append(row);
      });
    }

    render();
  </script>
</body>
</html>
